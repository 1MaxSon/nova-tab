name: Release extension

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Validate extension version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(node -p "require('./dist/manifest.json').version")"

          if [ "$tag_version" != "$manifest_version" ]; then
            echo "Tag version v$tag_version does not match dist/manifest.json version $manifest_version."
            echo "Update package.json/manifest version or push a matching tag."
            exit 1
          fi

      - name: Create ZIP artifact
        shell: bash
        run: |
          cd dist
          zip -r ../nova-tab.zip .

      - name: Restore CRX private key
        shell: bash
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [ -z "$CRX_PRIVATE_KEY" ]; then
            echo "CRX_PRIVATE_KEY secret is required."
            exit 1
          fi
          echo "$CRX_PRIVATE_KEY" | base64 --decode > crx-private-key.pem
          chmod 600 crx-private-key.pem

      - name: Build signed CRX
        shell: bash
        run: npx crx3 pack dist -o nova-tab.crx -p crx-private-key.pem

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nova Tab ${{ github.ref_name }}
          files: |
            nova-tab.zip
            nova-tab.crx
          fail_on_unmatched_files: true
          generate_release_notes: true
